name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Run Jest integration tests
      run: npm test
    - name: Verify disposable demo lifecycle
      run: npm run test:demo
    - name: Check browser test types
      run: npm run typecheck:e2e
    - name: Install Chromium for Playwright
      run: npx playwright install --with-deps chromium
    - name: Verify booking demo in Chromium
      run: npm run test:e2e
    - name: Upload browser failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: booking-demo-failure-evidence
        path: |
          test-results/
          playwright-report/
        retention-days: 7
